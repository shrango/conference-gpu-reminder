name: GPU reminder

on:
  schedule:
    - cron: "0 14 * * *"   # 每天 UTC 14:00（美中 8/9 点，北京 22 点），按需修改
  workflow_dispatch:        # 允许在 Actions 页面手动触发
    inputs:
      date:
        description: "模拟日期（如 2026-11-08，用来测试发送），留空 = 今天"
        required: false
  push:
    paths: ["conferences.toml"]   # 改了日期就重新生成日历

permissions:
  contents: write           # 用于提交更新后的 calendar.ics

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send reminders
        if: github.event_name != 'push'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SIM_DATE: ${{ inputs.date }}
        run: python gpu_reminder.py check ${SIM_DATE:+--date "$SIM_DATE"}

      - name: Regenerate calendar.ics
        run: |
          python gpu_reminder.py ics -o calendar.ics
          if ! git diff --quiet -- calendar.ics || [ -n "$(git ls-files --others -- calendar.ics)" ]; then
            git config user.name  "gpu-reminder-bot"
            git config user.email "gpu-reminder-bot@users.noreply.github.com"
            git add calendar.ics
            git commit -m "update calendar.ics"
            git push
          fi
