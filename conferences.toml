# ============ GPU 申请规则 ============
[settings]
lead_days = 15               # 申请至少提前多少天
align_submission = true      # true = 提交截止也对齐到 1号/15号（11/1 生效 → 10/15 前提交）
                             # false = 严格按“生效日 - 15 天”（11/1 生效 → 10/17 前提交）
deadline_basis = "paper"     # 截稿前 15 天按哪个截止日算："paper"（full submission）或 "abstract"
deadline_buffer_days = 15    # 截稿前多少天必须已经有 GPU
rebuttal_buffer_days = 0     # rebuttal 开始前多少天必须已经有 GPU
remind_offsets = [7, 3]      # 距离“提交 GPU 申请截止”还剩几天时提醒
timezone = "America/Chicago" # 判断“今天”用的时区（GitHub Actions 默认是 UTC）

# ============ 会议日期 ============
# abstract / paper / rebuttal 都是可选的（如 ARR 没有 abstract，就不写）
# estimated = true 表示官方尚未公布、按往年推算；官方公布后请更新日期并改成 false

[[conferences]]
